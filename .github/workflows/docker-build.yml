name: Build and Publish Docker Images

on:
  workflow_dispatch:
  #release: # auskommentiert, weil dockerfiles daweil noch leer
  #  types: [published] # On Realise ausgelöst dann

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ==========================================
  # BUILD & PUSH
  # ==========================================
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase repository name
        id: repo_name
        run: echo "lowercase_repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Token Auto von Repo
      # ==========================================
      # FRONTEND
      # ==========================================
      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo_name.outputs.lowercase_repo }}-frontend
          tags: |
            # immer vers nummer dazu
            type=semver,pattern={{raw}}
      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
      
      # ==========================================
      # Aggregator
      # ==========================================
      - name: Extract metadata for aggregator
        id: meta-aggregator
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo_name.outputs.lowercase_repo }}-aggregator
          tags: |
            # immer vers nummer dazu
            type=semver,pattern={{raw}}
      - name: Build and push aggregator Image
        uses: docker/build-push-action@v5
        with:
          context: ./sims-aggregator
          file: ./sims-aggregator/Dockerfile
          push: true
          tags: ${{ steps.meta-aggregator.outputs.tags }}
          labels: ${{ steps.meta-aggregator.outputs.labels }}

      
      # ==========================================
      # To Do Weitere
      # ==========================================

      # ==========================================
      # SBOM GENERATION & DEPENDENCY-TRACK
      # ==========================================
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install CycloneDX CLI Tool
        run: dotnet tool install --global CycloneDX

      - name: Generate and Upload SBOMs to Dependency-Track
        env:
          DEPTRACK_URL: ${{ secrets.DEPENDENCY_TRACK_URL }}
          DEPTRACK_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
        run: |
          mkdir -p ./sbom-output

          SERVICES=("sims-identity" "sims-aggregator" "sims-stix-ingest")

          for SERVICE in "${SERVICES[@]}"; do
            dotnet-cyclonedx "$SERVICE/$SERVICE.csproj" \
              -o ./sbom-output \
              -f "bom-$SERVICE.json" \
              --json

            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$DEPTRACK_URL/api/v1/bom" \
              -H "X-Api-Key: $DEPTRACK_KEY" \
              -F "projectName=$SERVICE" \
              -F "projectVersion=${{ github.ref_name }}" \
              -F "autoCreate=true" \
              -F "bom=@./sbom-output/bom-$SERVICE.json")

            HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)

            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "SUCCESS: $SERVICE successfully ingested by Dependency-Track!"
            else
              echo "ERROR: Dependency-Track rejected $SERVICE (HTTP $HTTP_STATUS)"
              echo "$RESPONSE"
              exit 1
            fi
          done

      # ==========================================
      # ATTACH TO GITHUB RELEASE
      # ==========================================
      - name: Attach SBOMs to GitHub Release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} ./sbom-output/bom-*.json --clobber
     
