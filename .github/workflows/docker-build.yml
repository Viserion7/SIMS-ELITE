name: Build and Publish Docker Images

on:
  workflow_dispatch:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ==========================================
  # BUILD & PUSH
  # ==========================================
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
      packages: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase repository name
        id: repo_name
        run: echo "lowercase_repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # FRONTEND
      # ==========================================
      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo_name.outputs.lowercase_repo }}-frontend
          tags: |
            type=semver,pattern={{raw}}

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
      
      # ==========================================
      # AGGREGATOR
      # ==========================================
      - name: Extract metadata for aggregator
        id: meta-aggregator
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo_name.outputs.lowercase_repo }}-aggregator
          tags: |
            type=semver,pattern={{raw}}

      - name: Build and push aggregator Image
        uses: docker/build-push-action@v5
        with:
          context: ./sims-aggregator
          file: ./sims-aggregator/Dockerfile
          push: true
          tags: ${{ steps.meta-aggregator.outputs.tags }}
          labels: ${{ steps.meta-aggregator.outputs.labels }}

      # ==========================================
      # IDENTITY
      # ==========================================
      - name: Extract metadata for identity
        id: meta-identity
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo_name.outputs.lowercase_repo }}-identity
          tags: |
            type=semver,pattern={{raw}}

      - name: Build and push identity Image
        uses: docker/build-push-action@v5
        with:
          context: ./sims-identity
          file: ./sims-identity/Dockerfile
          push: true
          tags: ${{ steps.meta-identity.outputs.tags }}
          labels: ${{ steps.meta-identity.outputs.labels }}

      # ==========================================
      # STIX INGEST
      # ==========================================
      - name: Extract metadata for stix-ingest
        id: meta-stix-ingest
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo_name.outputs.lowercase_repo }}-stix-ingest
          tags: |
            type=semver,pattern={{raw}}

      - name: Build and push stix-ingest Image
        uses: docker/build-push-action@v5
        with:
          context: ./sims-stix-ingest
          file: ./sims-stix-ingest/Dockerfile
          push: true
          tags: ${{ steps.meta-stix-ingest.outputs.tags }}
          labels: ${{ steps.meta-stix-ingest.outputs.labels }}

      # ==========================================
      # SBOM GENERATION & DEPENDENCY-TRACK
      # ==========================================
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install CycloneDX CLI Tool
        run: |
          dotnet tool install --global CycloneDX
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Generate and Upload SBOMs to Dependency-Track
        env:
          DEPTRACK_URL: ${{ secrets.DEPENDENCY_TRACK_URL }}
          DEPTRACK_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
        run: |
          mkdir -p ./sbom-output

          SERVICES=("sims-identity" "sims-aggregator" "sims-stix-ingest" "frontend")

          for SERVICE in "${SERVICES[@]}"; do
            # 1. Generate SBOM
            dotnet-CycloneDX "$SERVICE/$SERVICE.csproj" \
              -o ./sbom-output \
              --filename "bom-$SERVICE.json" \
              --json

            # 2. Base64 encode the file
            BOM_BASE64=$(base64 -w 0 "./sbom-output/bom-$SERVICE.json")

            # 3. Upload to Dependency-Track Server
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X PUT "$DEPTRACK_URL/api/v1/bom" \
              -H "Content-Type: application/json" \
              -H "X-Api-Key: $DEPTRACK_KEY" \
              -d "{
                \"projectName\": \"$SERVICE\",
                \"projectVersion\": \"${{ github.ref_name }}\",
                \"autoCreate\": true,
                \"bom\": \"$BOM_BASE64\"
              }")

            HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)

            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "SUCCESS: $SERVICE successfully ingested by Dependency-Track!"
            else
              echo "ERROR: Dependency-Track rejected $SERVICE (HTTP $HTTP_STATUS)"
              echo "$RESPONSE"
              exit 1
            fi
          done

      # ==========================================
      # ATTACH TO GITHUB RELEASE
      # ==========================================
      - name: Attach SBOMs to GitHub Release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} ./sbom-output/bom-*.json --clobber
