services:
  frontend:
    image: ghcr.io/viserion7/sims-elite-frontend:latest
    ports:
      - "2000:80"
    environment:
      IDENTITY_URL: ${IDENTITY_URL:-}
      AGGREGATOR_URL: ${AGGREGATOR_URL:-}
    depends_on:
      - aggregator
      - identity
    restart: unless-stopped

  aggregator:
    image: ghcr.io/viserion7/sims-elite-aggregator:latest
    ports:
      - "88:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_SERVICE_NAME: ${AGGR_OTEL_SERVICE_NAME:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${AGGR_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      POSTGRES_HOST: dbAggregator
      POSTGRES_USER: ${AGGR_POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${AGGR_POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${AGGR_POSTGRES_DB:-}
    depends_on:
      dbAggregator:
        condition: service_healthy
    restart: unless-stopped

  identity:
    image: ghcr.io/viserion7/sims-elite-identity:latest
    depends_on:
      dbidentity:
        condition: service_healthy
    restart: unless-stopped
  
  sims-stix-ingest:
    image: ghcr.io/viserion7/sims-elite-stix-ingest:latest
    ports:
      - "8080:8080"
    environment:
      - MongoDbSettings__ConnectionString=mongodb://${STIX_MONGO_USER}:${STIX_MONGO_PASSWORD}@dbstix:27017/?authSource=admin
      - MongoDbSettings__DatabaseName=stix_db
      - MongoDbSettings__CollectionName=stix_bundles
  depends_on:
      dbstix:
        condition: service_healthy
    restart: unless-stopped

  dbidentity:
    image: postgres:16
    environment:
      POSTGRES_USER: ${ID_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ID_POSTGRES_PASSWORD}
      POSTGRES_DB: ${ID_POSTGRES_DB}
    volumes:
      - ./dbidentity_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  dbAggregator:
    image: postgres:16
    environment:
      POSTGRES_USER: ${AGGR_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AGGR_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AGGR_POSTGRES_DB}
    volumes:
      - ./dbAggregator_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  dbstix:
    image: mongo:8.0
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${STIX_MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${STIX_MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${STIX_MONGO_DB}
    volumes:
      - ./dbstix_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - frontend
    restart: unless-stopped
    profiles:
      - tunnel


