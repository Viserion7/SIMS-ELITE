services:
  frontend:
    image: ghcr.io/viserion7/sims-elite-frontend:latest
    ports:
      - "2000:80"
    environment:
      IDENTITY_URL: ${IDENTITY_URL:-}
      AGGREGATOR_URL: ${AGGREGATOR_URL:-}
    depends_on:
      - aggregator
      - identidy
    restart: unless-stopped

  aggregator:
    image: ghcr.io/viserion7/sims-elite-aggregator:latest
    depends_on:
      dbAggregator:
        condition: service_healthy
    restart: unless-stopped

  identidy:
    image: ghcr.io/viserion7/sims-elite-identidy:latest
    depends_on:
      dbIdentidy:
        condition: service_healthy
    restart: unless-stopped

  dbIdentidy:
    image: postgres:16
    environment:
      POSTGRES_USER: ${ID_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ID_POSTGRES_PASSWORD}
      POSTGRES_DB: ${ID_POSTGRES_DB}
    volumes:
      - ./dbIdentidy_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  dbAggregator:
    image: postgres:16
    environment:
      POSTGRES_USER: ${AGGR_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AGGR_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AGGR_POSTGRES_DB}
    volumes:
      - ./dbAggregator_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped


  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - frontend
    restart: unless-stopped
    profiles:
      - tunnel


