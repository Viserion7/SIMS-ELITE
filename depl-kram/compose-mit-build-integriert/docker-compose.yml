services:
  frontend:
    build: ../../frontend
    ports:
      - "2000:80"
    environment:
      IDENTITY_URL: ${IDENTITY_URL:-http://identity:8080}
      AGGREGATOR_URL: ${AGGREGATOR_URL:-http://aggregator:8080}
    depends_on:
      - aggregator
      - identity
    restart: unless-stopped

  aggregator:
    build: ../../sims-aggregator
    ports:
      - "88:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_SERVICE_NAME: ${AGGR_OTEL_SERVICE_NAME:-sims-aggregator}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT__URL:-http://localhost:4317}
      OTEL_EXPORTER_OTLP_ENDPOINT__KEY: ${OTEL_EXPORTER_OTLP_ENDPOINT__KEY:-}
      POSTGRES_HOST: dbAggregator
      POSTGRES_USER: ${AGGR_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${AGGR_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${AGGR_POSTGRES_DB:-aggregator}
      IDENTITY_URL: ${IDENTITY_URL:-http://identity:8080}
    depends_on:
      dbAggregator:
        condition: service_healthy
    restart: unless-stopped

  identity:
    build: ../../sims-identity
    ports:
      - "67:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Key: ${JWT__KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT__url: ${OTEL_EXPORTER_OTLP_ENDPOINT__URL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT__key: ${OTEL_EXPORTER_OTLP_ENDPOINT__KEY:-}
      connectionString: "Host=dbidentity;Port=5432;Username=${ID_POSTGRES_USER};Password=${ID_POSTGRES_PASSWORD};Database=${ID_POSTGRES_DB}"
    depends_on:
      dbidentity:
        condition: service_healthy
    restart: unless-stopped

  incidentManager:
    build: ../../sims-incidentManager
    ports:
      - "420:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_SERVICE_NAME: ${INC_OTEL_SERVICE_NAME:-sims-incidentManager}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT__URL:-http://localhost:4317}
      OTEL_EXPORTER_OTLP_ENDPOINT__KEY: ${OTEL_EXPORTER_OTLP_ENDPOINT__KEY:-}
      IDENTITY_URL: ${IDENTITY_URL:-http://identity:8080}
      AGGREGATOR_URL: ${AGGREGATOR_URL:-http://aggregator:8080}
    depends_on:
      - identity
      - aggregator
    restart: unless-stopped

  sims-stix-ingest:
    build: ../../sims-stix-ingest
    ports:
      - "8080:8080"
    environment:
      - MongoDbSettings__ConnectionString=mongodb://${STIX_MONGO_USER}:${STIX_MONGO_PASSWORD}@dbstix:27017/?authSource=admin
      - MongoDbSettings__DatabaseName=stix_db
      - MongoDbSettings__CollectionName=stix_bundles
      - AggregatorSettings__BaseUrl=http://aggregator:8080
      - OTEL_EXPORTER_OTLP_ENDPOINT__url=${OTEL_EXPORTER_OTLP_ENDPOINT__URL:-}
    depends_on:
      dbstix:
        condition: service_healthy
      aggregator:
        condition: service_started
    restart: unless-stopped

  dbidentity:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${ID_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ID_POSTGRES_PASSWORD}
      POSTGRES_DB: ${ID_POSTGRES_DB}
    volumes:
      - ./dbidentity_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  dbAggregator:
    image: postgres:16
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${AGGR_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AGGR_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AGGR_POSTGRES_DB}
    volumes:
      - ./dbAggregator_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  dbstix:
    image: mongo:8.0
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${STIX_MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${STIX_MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${STIX_MONGO_DB}
    volumes:
      - ./dbstix_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped